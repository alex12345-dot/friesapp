<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fries Finder - Recensioni Patatine Fritte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>🍟 Fries Finder</h1>
      <p>Cerca il ristorante su Google Maps, vota le patatine e pubblica.</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Nuova recensione</h2>
        <form id="review-form">
          <label>
            Ristorante (Google Maps)
            <input type="text" id="name" name="name" required placeholder="Es. Friggitoria Milano" />
          </label>

          <label>
            Voto patatine (1-5)
            <input type="number" id="rating" name="rating" min="1" max="5" required />
          </label>

          <button type="submit">Pubblica</button>
        </form>
      </section>

      <section class="panel">
        <h2>Mappa ristorante</h2>
        <iframe
          id="map-frame"
          class="map"
          title="Mappa Google Maps"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Italia&output=embed"
        ></iframe>
      </section>

      <section class="panel panel-full">
        <div class="list-header">
          <h2>Recensioni recenti</h2>
          <button id="clear" class="danger" type="button">Svuota tutto</button>
        </div>
        <div id="reviews" class="reviews"></div>
      </section>
    </main>

    <template id="review-template">
      <article class="review-card">
        <h3 class="title"></h3>
        <p class="meta"></p>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
